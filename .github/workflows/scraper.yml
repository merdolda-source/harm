name: DiziPal Arşiv Güncelleyici

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # Yazma iznini buradan garantiye alıyoruz
      contents: write

    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Scripti Çalıştır
        run: python dizipal_tara.py

      - name: Güncel Dosyaları Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Dosyalar varsa ekle, yoksa hata verme
          git add dizipal.html || true
          git add dizipal_tv.html || true
          
          # Değişiklik varsa commit yap ve pushla
          if git diff --staged --quiet; then
            echo "Değişiklik yok, pushlanmıyor."
          else
            git commit -m "🚀 Otomatik Güncelleme: $(date +'%d-%m-%Y %H:%M')"
            git push
          fi
