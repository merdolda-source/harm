name: DiziPal Arşiv Güncelleyici

on:
  schedule:
    # Her gün Türkiye saatiyle gece 03:00'da çalışır (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manuel başlatma butonu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Scripti Çalıştır
        run: python dizipal_tara.py

      - name: Güncel Dosyaları Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Hata almamak için dosyaların varlığını kontrol ederek ekle
          if [ -f dizipal.html ]; then
            git add dizipal.html dizipal_tv.html
            git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Otomatik Güncelleme: $(date +'%d-%m-%Y %H:%M')" && git push)
          else
            echo "Uyarı: Güncellenecek dosya bulunamadı. Script engellenmiş olabilir."
          fi
